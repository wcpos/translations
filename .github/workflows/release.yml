name: Release

on:
  push:
    branches: [main]
    paths:
      - 'translations/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto CalVer)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: pnpm install

      - name: Clean up stale keys
        run: pnpm run cleanup:stale

      - name: Generate fallback locales
        run: pnpm run generate:fallbacks

      - name: Commit cleanup changes (if any)
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- translations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add translations/
            git commit -m "chore: auto-cleanup stale keys and regenerate fallbacks"
          fi

      - name: Validate translations (format)
        run: node scripts/validate-translations.js

      - name: Check completeness & placeholders
        run: pnpm run check:completeness

      - name: Calculate version
        id: version
        run: |
          git fetch --tags

          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="${YEAR}.${MONTH}."

          LATEST=$(git tag -l "${PREFIX}*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="${PREFIX}0"
          else
            CURRENT_N=$(echo "$LATEST" | awk -F. '{print $3}')
            VERSION="${PREFIX}$((CURRENT_N + 1))"
          fi

          # Allow manual override
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Generate consumer GitHub App token (preflight)
        id: preflight-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: monorepo,electron,woocommerce-pos,woocommerce-pos-pro
          permission-contents: write
          permission-pull-requests: write

      - name: Verify consumer GitHub App access
        env:
          GH_TOKEN: ${{ steps.preflight-app-token.outputs.token }}
        run: |
          for repo in monorepo electron woocommerce-pos woocommerce-pos-pro; do
            echo "Verifying GitHub App access to wcpos/$repo..."
            gh api "repos/wcpos/$repo" --jq '.full_name' >/dev/null
            gh api "repos/wcpos/$repo/pulls?state=open&per_page=1" >/dev/null
          done

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push the housekeeping commit to main first ([skip ci] prevents
          # this push from re-triggering release.yml), then create the tag via
          # the REST API. A plain `git push origin <tag>` is rejected whenever
          # the tag range contains workflow-file changes (e.g. Dependabot
          # action bumps), because GITHUB_TOKEN lacks the `workflows`
          # permission — that broke release 2026.7.4. API ref creation points
          # at an already-pushed commit, so no workflow scan applies.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git commit --amend -m "chore: auto-cleanup stale keys and regenerate fallbacks [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push rejected (attempt $attempt); rebasing onto latest main"
              git pull --rebase origin main
              sleep $((attempt * 5))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push release housekeeping commit after 3 attempts"
              exit 1
            fi
          fi
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$(git rev-parse HEAD)"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Translation release $VERSION

          ## jsDelivr URLs
          JS translations are available via jsDelivr:
          \`\`\`
          https://cdn.jsdelivr.net/gh/wcpos/translations@$VERSION/translations/js/{locale}/{project}/{namespace}.json
          \`\`\`

          ## PHP translations
          Download PHP translation files from the release assets below."

          # Attach PHP translation files as release assets
          for locale_dir in translations/php/*/; do
            locale=$(basename "$locale_dir")
            for file in "$locale_dir"*.{mo,l10n.php}; do
              if [ -f "$file" ]; then
                gh release upload "$VERSION" "$file" --clobber
              fi
            done
          done

          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**jsDelivr:** \`https://cdn.jsdelivr.net/gh/wcpos/translations@$VERSION/translations/js/{locale}/{project}/{namespace}.json\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate consumer GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: monorepo,electron,woocommerce-pos,woocommerce-pos-pro
          permission-contents: write
          permission-pull-requests: write

      - name: Update consuming repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node scripts/update-consumer-version-prs.js "$VERSION"
