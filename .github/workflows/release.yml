name: Release

on:
  push:
    branches: [main]
    paths:
      - 'translations/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty for auto CalVer)'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install

      - name: Clean up stale keys
        run: pnpm run cleanup:stale

      - name: Generate fallback locales
        run: pnpm run generate:fallbacks

      - name: Commit cleanup changes (if any)
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- translations)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add translations/
            git commit -m "chore: auto-cleanup stale keys and regenerate fallbacks"
          fi

      - name: Validate translations (format)
        run: node scripts/validate-translations.js

      - name: Check completeness & placeholders
        run: pnpm run check:completeness -- --warn-only

      - name: Calculate version
        id: version
        run: |
          git fetch --tags

          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="${YEAR}.${MONTH}."

          LATEST=$(git tag -l "${PREFIX}*" | sort -t. -k3 -n | tail -1)
          if [ -z "$LATEST" ]; then
            VERSION="${PREFIX}0"
          else
            CURRENT_N=$(echo "$LATEST" | awk -F. '{print $3}')
            VERSION="${PREFIX}$((CURRENT_N + 1))"
          fi

          # Allow manual override
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"
          git push origin "$VERSION"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "Translation release $VERSION

          ## jsDelivr URLs
          JS translations are available via jsDelivr:
          \`\`\`
          https://cdn.jsdelivr.net/gh/wcpos/translations@$VERSION/translations/js/{locale}/{project}/{namespace}.json
          \`\`\`

          ## PHP translations
          Download PHP translation files from the release assets below."

          # Attach PHP translation files as release assets
          for locale_dir in translations/php/*/; do
            locale=$(basename "$locale_dir")
            for file in "$locale_dir"*.{mo,l10n.php}; do
              if [ -f "$file" ]; then
                gh release upload "$VERSION" "$file" --clobber
              fi
            done
          done

          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**jsDelivr:** \`https://cdn.jsdelivr.net/gh/wcpos/translations@$VERSION/translations/js/{locale}/{project}/{namespace}.json\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: monorepo,electron,woocommerce-pos,woocommerce-pos-pro

      - name: Notify consuming repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for repo in monorepo electron woocommerce-pos woocommerce-pos-pro; do
            echo "Dispatching translation-release to wcpos/$repo with version $VERSION..."
            gh api "repos/wcpos/$repo/dispatches" \
              --method POST \
              -f event_type=translation-release \
              -f "client_payload[version]=$VERSION" || echo "Warning: failed to notify $repo"
          done
