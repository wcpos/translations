name: Translation Quality Smoke Check

on:
  # No paths filter: ruleset 24240730 requires this check, and a PR the filter skipped would wait on it forever.
  pull_request:
  workflow_dispatch:
    inputs:
      changed_since:
        description: Git ref to compare against (defaults to origin/main)
        required: false
        default: origin/main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: pnpm install

      - name: Install gettext
        run: command -v msgfmt >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gettext; }

      - name: Prove the PO format gate rejects the sv_SE bare-% fixture
        run: node tests/test-po-format-check.js

      - name: Check PHP format directives in every .po (msgfmt --check-format)
        run: sh scripts/check-po-format.sh

      - name: Check committed .mo files match their .po
        run: node scripts/generate-mo-files.js --check

      - name: Run changed-file completeness gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.changed_since }}
        run: |
          set -euo pipefail
          echo "Checking changed translation completeness against: $BASE_REF"
          pnpm --silent run check:completeness -- --changed-since "$BASE_REF" --github-annotations

      - name: Run quality smoke check
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.changed_since }}
        run: |
          set -euo pipefail
          echo "Comparing changed translations against: $BASE_REF"

          pnpm --silent run qa:quality -- --changed-since "$BASE_REF" --github-annotations
          pnpm --silent run qa:quality -- --changed-since "$BASE_REF" --markdown | tee translation-quality-summary.md

          {
            cat translation-quality-summary.md
            echo
            echo "_This is a warning-only smoke check. Native review is still required for production-quality translations._"
          } >> "$GITHUB_STEP_SUMMARY"
