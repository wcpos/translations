name: Translation QA

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Locale to QA (leave empty for all)'
        required: false
        default: ''
      type:
        description: 'What to QA'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - js
          - php
      structural_only:
        description: 'Skip back-translation (faster, structural checks only)'
        required: false
        default: false
        type: boolean
      apply_fixes:
        description: 'Auto-apply corrections'
        required: false
        default: true
        type: boolean

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.locales.outputs.list }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: locales
        run: |
          if [ -n "${{ inputs.locale }}" ]; then
            echo 'list=["${{ inputs.locale }}"]' >> $GITHUB_OUTPUT
          else
            echo "list=$(jq -c 'keys' locales.json)" >> $GITHUB_OUTPUT
          fi

  qa:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        locale: ${{ fromJson(needs.setup.outputs.locales) }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install

      - name: QA ${{ matrix.locale }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS="${{ matrix.locale }} --type ${{ inputs.type }}"
          if [ "${{ inputs.structural_only }}" = "true" ]; then
            ARGS="$ARGS --structural-only"
          fi
          if [ "${{ inputs.apply_fixes }}" = "true" ]; then
            ARGS="$ARGS --apply-fixes"
          fi
          node scripts/qa-translations.js $ARGS || true

      - name: Upload fixes
        if: inputs.apply_fixes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-fixes-${{ matrix.locale }}
          path: translations/
          retention-days: 7

  commit-fixes:
    needs: qa
    if: inputs.apply_fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download fixes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-fixes
          pattern: qa-fixes-*

      - name: Merge fixes
        run: |
          for dir in downloaded-fixes/qa-fixes-*/; do
            cp -r "$dir"* translations/ 2>/dev/null || true
          done

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="qa-fixes-$(date +%Y-%m-%d)"
          git checkout -B "$TARGET_BRANCH"

          git add translations/
          if git diff --staged --quiet; then
            echo "No fixes to commit"
          else
            git commit -m "fix: QA translation corrections"
            git push -u origin "$TARGET_BRANCH"

            echo "## QA Fixes Ready" >> $GITHUB_STEP_SUMMARY
            echo "Branch: \`$TARGET_BRANCH\`" >> $GITHUB_STEP_SUMMARY
          fi
