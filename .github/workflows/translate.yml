name: Translate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Translation mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - test      # Single locale (de_DE), for testing
          - changed   # Only new/changed strings
          - all       # Force retranslate everything
      type:
        description: 'What to translate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - js
          - php

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      locales: ${{ steps.locales.outputs.list }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: locales
        run: |
          if [ "${{ inputs.mode }}" = "test" ]; then
            echo 'list=["de_DE"]' >> $GITHUB_OUTPUT
          else
            echo "list=$(jq -c 'keys' locales.json)" >> $GITHUB_OUTPUT
          fi

  translate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        locale: ${{ fromJson(needs.setup.outputs.locales) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install

      - name: Translate to ${{ matrix.locale }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.mode }}" = "all" ]; then
            FORCE_FLAG="--force"
          fi
          node scripts/translate-locale.js ${{ matrix.locale }} --type ${{ inputs.type }} $FORCE_FLAG

      - name: Generate PHP files
        if: inputs.type == 'all' || inputs.type == 'php'
        run: node scripts/generate-php-files.js ${{ matrix.locale }}

      - name: Upload translations
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: translations-${{ matrix.locale }}
          path: |
            translations/
            .translation-state.json
          retention-days: 1

  commit:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download all translations
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: downloaded
          pattern: translations-*

      - name: Merge translations
        run: |
          for dir in downloaded/translations-*/; do
            locale=$(basename "$dir" | sed 's/translations-//')
            echo "Merging $locale..."

            # Merge JS translations
            if [ -d "$dir/translations/js/$locale" ]; then
              mkdir -p "translations/js/$locale"
              cp -r "$dir/translations/js/$locale/"* "translations/js/$locale/" 2>/dev/null || true
            fi

            # Merge PHP translations
            if [ -d "$dir/translations/php/$locale" ]; then
              mkdir -p "translations/php/$locale"
              cp -r "$dir/translations/php/$locale/"* "translations/php/$locale/" 2>/dev/null || true
            fi

            # Merge state (last writer wins per key, which is fine since each locale writes different keys)
            if [ -f "$dir/.translation-state.json" ]; then
              if [ -f ".translation-state.json" ]; then
                # Merge JSON objects
                jq -s '.[0] * .[1]' .translation-state.json "$dir/.translation-state.json" > .tmp-state.json
                mv .tmp-state.json .translation-state.json
              else
                cp "$dir/.translation-state.json" .translation-state.json
              fi
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install

      - name: Validate
        run: |
          # Quick JSON validation
          shopt -s globstar
          for f in translations/js/**/*.json; do
            if ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "Invalid JSON: $f"
              exit 1
            fi
          done
          echo "All JSON files valid"

      - name: Generate fallbacks
        run: node scripts/generate-fallbacks.js

      - name: Commit translations
        id: commit
        if: inputs.mode != 'test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="translations-$(date +%Y-%m-%d)"
          echo "branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          git checkout -B "$TARGET_BRANCH"

          git add translations/
          [ -f .translation-state.json ] && git add .translation-state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: translate strings (${{ inputs.mode }} mode)"
            git push --force-with-lease -u origin "$TARGET_BRANCH"
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create or update PR
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ steps.commit.outputs.branch }}"
          EXISTING_PR=$(gh pr list --head "$TARGET_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updated via force-push"
            echo "## Translations Updated" >> $GITHUB_STEP_SUMMARY
            echo "Updated PR #$EXISTING_PR" >> $GITHUB_STEP_SUMMARY
          else
            gh pr create \
              --title "Update translations $(date +%Y-%m-%d)" \
              --body "Automated translation update (${{ inputs.mode }} mode, ${{ inputs.type }} type)." \
              --base main \
              --head "$TARGET_BRANCH"
            echo "## Translations Ready" >> $GITHUB_STEP_SUMMARY
            echo "PR created for branch \`$TARGET_BRANCH\`" >> $GITHUB_STEP_SUMMARY
          fi
