name: Receive PHP Strings

on:
  # Free plugin pushes its POT via repository_dispatch
  repository_dispatch:
    types:
      - update-free-pot
      - update-pro-pot

concurrency:
  group: extract-php
  cancel-in-progress: true

jobs:
  receive-free:
    if: github.event.client_payload.pot_content && github.event.action == 'update-free-pot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4

      - name: Write POT file
        run: |
          mkdir -p source/php
          echo '${{ github.event.client_payload.pot_content }}' | base64 -d > source/php/woocommerce-pos.pot
          echo "Received free plugin POT file"
          grep -c '^msgid ' source/php/woocommerce-pos.pot || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/php/woocommerce-pos.pot
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
          else
            git commit -m "chore: update free plugin source strings" --allow-empty
            git push
          fi

  receive-pro:
    if: github.event.client_payload.pot_content && github.event.action == 'update-pro-pot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4

      - name: Write POT file
        run: |
          mkdir -p source/php
          echo '${{ github.event.client_payload.pot_content }}' | base64 -d > source/php/woocommerce-pos-pro.pot
          echo "Received pro plugin POT file"
          grep -c '^msgid ' source/php/woocommerce-pos-pro.pot || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/php/woocommerce-pos-pro.pot
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
          else
            git commit -m "chore: update pro plugin source strings" --allow-empty
            git push
          fi
