name: Receive PHP Strings

on:
  # Free plugin pushes its POT via repository_dispatch
  repository_dispatch:
    types:
      - update-free-pot
      - update-pro-pot

permissions:
  contents: write
  actions: write

concurrency:
  group: extract-php
  cancel-in-progress: true

jobs:
  receive-free:
    if: github.event.action == 'update-free-pot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate payload
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          POT_FILE="${{ github.event.client_payload.pot_file }}"

          if [ "$REPO" != "woocommerce-pos" ]; then
            echo "Invalid source repo: $REPO"
            exit 1
          fi

          if [[ ! "$REF" =~ ^translations-source-php/[0-9]+-[0-9]+$ ]]; then
            echo "Invalid source ref: $REF"
            exit 1
          fi

          if [ "$POT_FILE" != "woocommerce-pos.pot" ]; then
            echo "Invalid POT file: $POT_FILE"
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: ${{ github.event.client_payload.repo_name }}

      - name: Fetch POT file
        id: fetch-pot
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          POT_FILE="${{ github.event.client_payload.pot_file }}"

          mkdir -p source/php
          git clone --depth 1 --branch "$REF" \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git" \
            _source

          cp "_source/$POT_FILE" source/php/woocommerce-pos.pot
          rm -rf _source

          echo "Copied free plugin POT file from wcpos/$REPO@$REF:$POT_FILE"
          grep -c '^msgid ' source/php/woocommerce-pos.pot || true

      - name: Commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add source/php/woocommerce-pos.pot
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main moves underneath us (forward-to-aide pushes context artifacts
          # ~1 min after every receive, so free/pro dispatches close together
          # collide). Checkout is pinned to the dispatch SHA, so a bare push
          # loses that race. Re-stage the POT on top of whatever main is now:
          # this job's only change is overwriting one file, so a hard reset
          # plus re-copy is conflict-free by construction.
          cp source/php/woocommerce-pos.pot "$RUNNER_TEMP/woocommerce-pos.pot"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git commit -m "chore: update free plugin source strings" --allow-empty
            if git push; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt); resetting onto latest main"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/woocommerce-pos.pot" source/php/woocommerce-pos.pot
            git add source/php/woocommerce-pos.pot
            if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
              echo "POT already on main"
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push free plugin source strings after 5 attempts"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger translation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run forward-to-aide.yml -f project=woocommerce-pos -f type=php

      # Only once the POT is on main. If the commit failed, keep the source
      # branch so re-running the failed job recovers the update instead of
      # losing it.
      - name: Delete source branch
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.fetch-pot.outcome == 'success' && steps.commit.outcome == 'success' }}
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          git push \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git" \
            --delete "$REF"

  receive-pro:
    if: github.event.action == 'update-pro-pot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate payload
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          POT_FILE="${{ github.event.client_payload.pot_file }}"

          if [ "$REPO" != "woocommerce-pos-pro" ]; then
            echo "Invalid source repo: $REPO"
            exit 1
          fi

          if [[ ! "$REF" =~ ^translations-source-php/[0-9]+-[0-9]+$ ]]; then
            echo "Invalid source ref: $REF"
            exit 1
          fi

          if [ "$POT_FILE" != "woocommerce-pos-pro.pot" ]; then
            echo "Invalid POT file: $POT_FILE"
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: ${{ github.event.client_payload.repo_name }}

      - name: Fetch POT file
        id: fetch-pot
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          POT_FILE="${{ github.event.client_payload.pot_file }}"

          mkdir -p source/php
          git clone --depth 1 --branch "$REF" \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git" \
            _source

          cp "_source/$POT_FILE" source/php/woocommerce-pos-pro.pot
          rm -rf _source

          echo "Copied pro plugin POT file from wcpos/$REPO@$REF:$POT_FILE"
          grep -c '^msgid ' source/php/woocommerce-pos-pro.pot || true

      - name: Commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add source/php/woocommerce-pos-pro.pot
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main moves underneath us (forward-to-aide pushes context artifacts
          # ~1 min after every receive, so free/pro dispatches close together
          # collide). Checkout is pinned to the dispatch SHA, so a bare push
          # loses that race. Re-stage the POT on top of whatever main is now:
          # this job's only change is overwriting one file, so a hard reset
          # plus re-copy is conflict-free by construction.
          cp source/php/woocommerce-pos-pro.pot "$RUNNER_TEMP/woocommerce-pos-pro.pot"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git commit -m "chore: update pro plugin source strings" --allow-empty
            if git push; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt); resetting onto latest main"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/woocommerce-pos-pro.pot" source/php/woocommerce-pos-pro.pot
            git add source/php/woocommerce-pos-pro.pot
            if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
              echo "POT already on main"
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push pro plugin source strings after 5 attempts"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger translation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run forward-to-aide.yml -f project=woocommerce-pos-pro -f type=php

      # Only once the POT is on main. If the commit failed, keep the source
      # branch so re-running the failed job recovers the update instead of
      # losing it.
      - name: Delete source branch
        if: ${{ always() && steps.app-token.outcome == 'success' && steps.fetch-pot.outcome == 'success' && steps.commit.outcome == 'success' }}
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          REF="${{ github.event.client_payload.ref }}"
          git push \
            "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git" \
            --delete "$REF"
