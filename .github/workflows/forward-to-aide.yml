# forward-to-aide.yml
# Called by receive-js-strings.yml and receive-php-strings.yml after they commit
# source strings. Forwards a translation request to Aide's webhook so Aide can
# translate the newly committed strings.
#
# Required secrets:
#   OPENCLAW_HOOKS_TOKEN — bearer token matching OPENCLAW_HOOKS_TOKEN in docker-compose
#   TRANSLATION_STATUS_TOKEN — bearer token that can read GET /api/tasks/:id for polling

name: Forward strings to Aide

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name (e.g. woocommerce-pos)
        required: true
      type:
        description: Type of strings (js or php)
        required: true
        default: js

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout translations
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Forward to Aide webhook
        env:
          OPENCLAW_BASE_URL: https://openclaw.wcpos.com
          OPENCLAW_HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          TRANSLATION_STATUS_TOKEN: ${{ secrets.TRANSLATION_STATUS_TOKEN }}
        run: |
          project="${{ inputs.project }}"
          type="${{ inputs.type }}"

          if [ -z "$project" ]; then
            echo "::error::project input is required"
            exit 1
          fi

          if [ -z "$OPENCLAW_HOOKS_TOKEN" ]; then
            echo "::error::OPENCLAW_HOOKS_TOKEN secret is required"
            exit 1
          fi

          if [ -z "$TRANSLATION_STATUS_TOKEN" ]; then
            echo "::error::TRANSLATION_STATUS_TOKEN secret is required to poll translation task status"
            exit 1
          fi

          # Build changed_files from actual files on disk
          if [ "$type" = "php" ]; then
            source_dir="source/php"
            pattern="${project}.pot"
          else
            source_dir="source/js/${project}"
            pattern="*.json"
          fi

          if [ ! -d "$source_dir" ]; then
            echo "::error::Source directory $source_dir does not exist"
            exit 1
          fi

          changed_files=$(find "$source_dir" -name "$pattern" -printf '%p\n' | jq -R . | jq -s .)
          file_count=$(echo "$changed_files" | jq length)

          if [ "$file_count" -eq 0 ]; then
            echo "::error::No source files found in $source_dir matching $pattern"
            exit 1
          fi

          payload=$(jq -n \
            --arg project "$project" \
            --argjson changed_files "$changed_files" \
            '{project: $project, changed_files: $changed_files}')

          echo "Forwarding to Aide: project=$project type=$type files=$file_count"
          echo "$changed_files" | jq -r '.[]'

          http_code=$(curl -s -o /tmp/aide_response.json -w "%{http_code}" \
            --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer $OPENCLAW_HOOKS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$OPENCLAW_BASE_URL/translation/webhook")

          status=$(jq -r '.status // (if .accepted == true then "accepted" else "unknown" end)' /tmp/aide_response.json 2>/dev/null || echo "unknown")
          echo "Aide response: http=$http_code status=$status"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Aide webhook returned HTTP $http_code"
            cat /tmp/aide_response.json
            exit 1
          fi

          node scripts/wait-for-openclaw-task.js /tmp/aide_response.json
