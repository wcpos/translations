name: Receive JS Strings

on:
  repository_dispatch:
    types:
      - update-js-strings

permissions:
  contents: write

concurrency:
  group: receive-js-${{ github.event.client_payload.repo_name }}-${{ github.event.client_payload.lane || 'main' }}
  cancel-in-progress: true

jobs:
  receive:
    if: github.event.client_payload.repo_name && github.event.client_payload.ref
    runs-on: ubuntu-latest
    steps:
      - name: Validate lane
        run: |
          LANE="${{ github.event.client_payload.lane || 'main' }}"
          if [ "$LANE" != main ] && [ "$LANE" != next ]; then
            echo "::error::Invalid lane: $LANE (expected main or next)"
            exit 1
          fi

      - name: Checkout translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.lane || 'main' }}
          persist-credentials: false

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: ${{ github.event.client_payload.repo_name }}

      - name: Fetch source strings
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          mkdir -p "source/js/$REPO"

          git clone --depth 1 --branch ${{ github.event.client_payload.ref }} \
            https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git \
            _source

          cp _source/*.json "source/js/$REPO/"
          rm -rf _source

          echo "Copied files from wcpos/$REPO@${{ github.event.client_payload.ref }}:"
          ls -la "source/js/$REPO/"

      - name: Normalize JSON formatting
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          for f in source/js/$REPO/*.json; do
            [ -f "$f" ] || continue
            python3 -c "
          import json
          path = '$f'
          with open(path) as fh:
              data = json.load(fh)
          with open(path, 'w') as fh:
              json.dump(data, fh, indent=2, ensure_ascii=False, sort_keys=True)
              fh.write('\n')
          "
          done
          echo "Normalized JSON files in source/js/$REPO/"

      - name: Validate source key counts
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          for f in source/js/$REPO/*.json; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")

            new_count=$(python3 -c "import json; print(len(json.load(open('$f'))))")

            # Check previous version if it exists
            old_count=$(git show HEAD:"source/js/$REPO/$filename" 2>/dev/null \
              | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")

            echo "$REPO/$filename: $old_count → $new_count keys"

            if [ "$old_count" -gt 20 ] && [ "$new_count" -lt $(( old_count / 2 )) ]; then
              echo "::error::$REPO/$filename lost >50% of keys ($old_count → $new_count). Aborting to protect translations."
              exit 1
            fi
          done

      - name: Commit changes
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          LANE="${{ github.event.client_payload.lane || 'main' }}"
          REPO="${{ github.event.client_payload.repo_name }}"
          git add source/js/
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # The lane can move underneath this job (sync-next, release
          # housekeeping, the PHP receiver). Re-stage the normalised source
          # files on top of the latest lane tip after a push race: this job's
          # only change is overwriting one repo's source directory, so a hard
          # reset plus re-copy is conflict-free by construction.
          mkdir -p "$RUNNER_TEMP/source-js"
          cp source/js/"$REPO"/*.json "$RUNNER_TEMP/source-js/"
          pushed=0
          for attempt in 1 2 3 4 5; do
            git commit -m "chore: update JS source strings from wcpos/$REPO" --allow-empty
            if git push origin HEAD:"$LANE"; then
              pushed=1
              break
            fi
            echo "Push rejected (attempt $attempt); resetting onto latest $LANE"
            git fetch origin "$LANE"
            git reset --hard "origin/$LANE"
            cp "$RUNNER_TEMP/source-js"/*.json source/js/"$REPO"/
            git add source/js/
            if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
              echo "Source strings already on $LANE"
              pushed=1
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push JS source strings after 5 attempts"
            exit 1
          fi
          echo "changed=true" >> $GITHUB_OUTPUT
