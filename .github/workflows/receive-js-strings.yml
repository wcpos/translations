name: Receive JS Strings

on:
  repository_dispatch:
    types:
      - update-js-strings

permissions:
  contents: write
  actions: write

concurrency:
  group: receive-js-${{ github.event.client_payload.repo_name }}
  cancel-in-progress: true

jobs:
  receive:
    if: github.event.client_payload.repo_name && github.event.client_payload.ref
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRANSLATION_APP_ID }}
          private-key: ${{ secrets.TRANSLATION_APP_PRIVATE_KEY }}
          owner: wcpos
          repositories: ${{ github.event.client_payload.repo_name }}

      - name: Fetch source strings
        run: |
          REPO="${{ github.event.client_payload.repo_name }}"
          mkdir -p "source/js/$REPO"

          git clone --depth 1 --branch ${{ github.event.client_payload.ref }} \
            https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/wcpos/$REPO.git \
            _source

          cp _source/*.json "source/js/$REPO/"
          rm -rf _source

          echo "Copied files from wcpos/$REPO@${{ github.event.client_payload.ref }}:"
          ls -la "source/js/$REPO/"

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/js/
          if git diff --staged --quiet && [ "${{ github.event.client_payload.force }}" != "true" ]; then
            echo "No changes"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update JS source strings from wcpos/${{ github.event.client_payload.repo_name }}" --allow-empty
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger translation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run translate.yml -f mode=changed -f type=js
