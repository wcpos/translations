name: Receive JS Source Strings

on:
  repository_dispatch:
    types:
      - update-js-strings

concurrency:
  group: receive-js
  cancel-in-progress: true

jobs:
  receive:
    if: github.event.client_payload.files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4

      - name: Write JSON files
        run: |
          mkdir -p source/js

          echo '${{ toJSON(github.event.client_payload.files) }}' | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r name content; do
            echo "$content" | base64 -d > "source/js/$name"
            echo "Wrote source/js/$name"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/js/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update JS source strings from ${{ github.event.client_payload.ref }}"
            git push
          fi
