name: Extract JS Strings

on:
  # Triggered by the monorepo via workflow_dispatch
  workflow_dispatch:
    inputs:
      ref:
        description: 'Monorepo ref (tag, branch, or SHA)'
        required: false
        default: 'main'

concurrency:
  group: extract-js
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: wcpos/wcpos
          ref: ${{ inputs.ref }}
          path: monorepo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install

      - name: Extract strings
        run: node scripts/extract-js-strings.js monorepo

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet source/js/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/js/
          git commit -m "chore: update JS source strings from ${{ inputs.ref }}"
          git push
